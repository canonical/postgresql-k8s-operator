name: Terraform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - "tests/terraform/**"
      - "tests/integration/terraform/**"
      - "tox.ini"
      - ".github/workflows/terraform.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks + constraint compositions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform init
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform -chdir=terraform validate -no-color

      - name: Install tox & poetry
        run: pipx install tox poetry

      - name: Constraint-composition tests
        run: tox run -e terraform
