summary: terraform/test_terraform_deploy.py (juju terraform provider v1)
environment:
  TEST_MODULE: terraform/test_terraform_deploy.py
  # Pin the consumer's juju provider constraint to the v1 line so the deploy
  # applies the module under juju/juju v1.x (~> 1.0 intersects the module's
  # own >= 1.0, < 3.0 and resolves to v1.5.6), not just the default v2.x.
  TF_PROVIDER_CONSTRAINT: "~> 1.0"
execute: |
  # The terraform binary is not part of the concierge substrate; install it for this task only.
  sudo snap install terraform --classic

  tox run -e integration -- "tests/integration/$TEST_MODULE" --model testing --alluredir="$SPREAD_TASK/allure-results"
artifacts:
  - allure-results